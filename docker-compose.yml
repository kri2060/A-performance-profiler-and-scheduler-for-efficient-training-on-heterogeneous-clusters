# Multi-Node Distributed Training with Docker
# This compose file is for SINGLE MACHINE with multiple GPUs
# For multi-machine setup, use individual docker commands (see scripts/)

version: '3.8'

services:
  # Master node with dashboard
  master:
    build: .
    container_name: hetero-master
    hostname: master
    networks:
      - hetero-net
    ports:
      - "8501:8501"    # Streamlit Dashboard
      - "29500:29500"  # PyTorch DDP master port
    volumes:
      - ./:/workspace
      - ./experiments:/workspace/experiments
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MASTER_ADDR=master
      - MASTER_PORT=29500
      - RANK=0
      - WORLD_SIZE=3
    stdin_open: true
    tty: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # Worker nodes (for same machine only)
  worker1:
    build: .
    container_name: hetero-worker1
    hostname: worker1
    networks:
      - hetero-net
    volumes:
      - ./:/workspace
      - ./experiments:/workspace/experiments
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MASTER_ADDR=master
      - MASTER_PORT=29500
      - RANK=1
      - WORLD_SIZE=3
    depends_on:
      - master
    stdin_open: true
    tty: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  worker2:
    build: .
    container_name: hetero-worker2
    hostname: worker2
    networks:
      - hetero-net
    volumes:
      - ./:/workspace
      - ./experiments:/workspace/experiments
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MASTER_ADDR=master
      - MASTER_PORT=29500
      - RANK=2
      - WORLD_SIZE=3
    depends_on:
      - master
    stdin_open: true
    tty: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  # Redis for metrics storage
  redis:
    image: redis:7-alpine
    container_name: hetero-redis
    hostname: redis
    networks:
      - hetero-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: hetero-grafana
    hostname: grafana
    networks:
      - hetero-net
    ports:
      - "3000:3000"  # Grafana UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - redis
    restart: unless-stopped

  # Redis exporter for Grafana (exposes Redis metrics)
  redis-exporter:
    build:
      context: .
      dockerfile: Dockerfile.redis-exporter
    container_name: hetero-redis-exporter
    hostname: redis-exporter
    networks:
      - hetero-net
    ports:
      - "9121:9121"  # Prometheus-compatible metrics endpoint
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

networks:
  hetero-net:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
